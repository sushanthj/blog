site: Duet Jekyll Theme

collections:
  pages:
    output: true
    permalink: /:path/
  posts:
    output: true
    permalink: /:categories/:title/
  projects:
    output: true
    permalink: /project/:slug

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "images"
      type: "pages"
    values:
      permalink: "/images/:path/"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "_posts/blog"
      type: "posts"
    values:
      layout: "blog-post"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Build/tooling files — kept out of the published site.
# NOTE: setting `exclude` REPLACES Jekyll's built-in defaults rather than adding
# to them, so the default entries (Gemfile, vendor, node_modules, ...) are
# repeated here explicitly. Removing them republishes those files to the site.
exclude:
  # Jekyll defaults
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  # Project tooling
  - docker
  - docs
  - config
  - Makefile
  - README.md
  - CLAUDE.md
  - .dockerignore
  - .ruby-version

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
  toc_levels: 1..6
  auto_ids: true
  heading_anchors: true
  hard_wrap: false
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  
sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

repository: sushanthj/blog