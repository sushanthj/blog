<!-- Mermaid (loaded globally for AJAX page navigation support, same reason as MathJax).
     Kramdown emits ```mermaid fences as div.language-mermaid code blocks; renderMermaid()
     swaps them for pre.mermaid holders and lets Mermaid render in place. duet.js calls
     window.renderMermaid() after every AJAX page load, next to the MathJax re-typeset. -->
<script type="module">
	import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

	mermaid.initialize({
		startOnLoad: false,
		securityLevel: "loose",
		theme: "base",
		themeVariables: {
			background: "#0f1117",
			fontFamily: '"Muli", sans-serif',
			fontSize: "14px",
			primaryColor: "#1a1d27",
			primaryTextColor: "#e0e0e6",
			primaryBorderColor: "#2a2d3a",
			secondaryColor: "#1a1d27",
			tertiaryColor: "#131620",
			lineColor: "#8b8fa3",
			textColor: "#e0e0e6",
			nodeTextColor: "#e0e0e6",
			clusterBkg: "#131620",
			clusterBorder: "#2a2d3a",
			edgeLabelBackground: "#0f1117",
			titleColor: "#e0e0e6"
		},
		flowchart: { htmlLabels: true, useMaxWidth: true, curve: "basis" }
	});

	window.renderMermaid = function () {
		document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach(function (el) {
			var target = el.tagName === "DIV" ? el : el.parentElement;
			var holder = document.createElement("pre");
			holder.className = "mermaid";
			holder.textContent = el.textContent;
			target.replaceWith(holder);
		});
		mermaid.run({ querySelector: "pre.mermaid" });
	};

	window.renderMermaid();
</script>
