<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five sampled locomotion trajectories: the only positive-return sample is falling forward, so the gradient reinforces it" font-family="Muli, sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#0f1117"/>
  <text x="400" y="28" text-anchor="middle" fill="#e0e0e6" font-size="15" font-weight="600">Five sampled trajectories — learning to walk</text>
  <text x="400" y="48" text-anchor="middle" fill="#8b8fa3" font-size="11.5">r(s, a) = forward velocity</text>
  <circle cx="150.0" cy="168.0" r="5" fill="#141721" stroke="#e0e0e6" stroke-width="1.6"/>
  <text x="150" y="150" text-anchor="middle" fill="#e0e0e6" font-size="13" font-style="italic">s₀</text>
  <line x1="90.0" y1="215.0" x2="580.0" y2="215.0" stroke="#565b6e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="390" y="228" text-anchor="middle" fill="#565b6e" font-size="10">forward displacement →</text>
  <path d="M150,170 C148,175 140,190 132,210" fill="none" stroke="#f38ba8" stroke-width="1.8" opacity="0.8"/>
  <text x="152" y="240" text-anchor="middle" fill="#8b8fa3" font-size="10">falls backward</text>
  <text x="152" y="253" text-anchor="middle" fill="#f38ba8" font-size="10">R &lt; 0</text>
  <path d="M150,173 C120,183 105,200 100,210" fill="none" stroke="#f38ba8" stroke-width="1.6" opacity="0.6"/>
  <text x="64" y="240" text-anchor="middle" fill="#8b8fa3" font-size="10">back, then forward</text>
  <text x="64" y="253" text-anchor="middle" fill="#f38ba8" font-size="10">R &lt; 0</text>
  <path d="M150,165 C156,162 160,163 163,165" fill="none" stroke="#e6c07b" stroke-width="1.8" opacity="0.8"/>
  <text x="170" y="192" text-anchor="start" fill="#8b8fa3" font-size="10">stands still · R = 0</text>
  <path d="M150,168 C220,150 280,155 300,180 C315,200 305,210 295,215" fill="none" stroke="#f38ba8" stroke-width="1.6" opacity="0.7"/>
  <text x="300" y="240" text-anchor="middle" fill="#8b8fa3" font-size="10">steps forward, falls</text>
  <text x="300" y="253" text-anchor="middle" fill="#f38ba8" font-size="10">R &lt; 0</text>
  <path d="M150,162 C250,135 380,140 450,170 C480,185 500,205 510,215" fill="none" stroke="#7ddba0" stroke-width="2.2"/>
  <text x="512" y="240" text-anchor="middle" fill="#8b8fa3" font-size="10">falls forward</text>
  <text x="512" y="253" text-anchor="middle" fill="#7ddba0" font-size="10">R &gt; 0 — highest return in the batch</text>
  <rect x="470" y="78" width="295" height="78" fill="#1a1d27" rx="8" stroke="#2a2d3a" stroke-width="1.5"/>
  <text x="618" y="102" text-anchor="middle" fill="#e0e0e6" font-size="12.5" font-weight="600">Gradient update</text>
  <text x="618" y="122" text-anchor="middle" fill="#8b8fa3" font-size="11">increase the probability of the</text>
  <text x="618" y="137" text-anchor="middle" fill="#8b8fa3" font-size="11">highest-return sample — falling forward</text>
  <text x="400" y="310" text-anchor="middle" fill="#8b8fa3" font-size="12">With few samples the gradient estimate is noisy: the policy learns to fall forward, not to walk</text>
  <text x="400" y="330" text-anchor="middle" fill="#565b6e" font-size="11" font-style="italic">the high-variance problem of policy gradients</text>
</svg>
