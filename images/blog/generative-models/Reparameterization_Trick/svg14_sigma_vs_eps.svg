<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The two ingredients of z equals mu plus sigma times epsilon: sigma sets the width of the Gaussian and is learned per input; epsilon is a fresh standard-normal draw that picks where inside the Gaussian each sample lands" font-family="Muli, sans-serif">
  <rect x="0" y="0" width="940" height="480" fill="#0f1117"/>

  <text x="470" y="38" text-anchor="middle" font-size="21" fill="#e0e0e6">
    <tspan fill="#b794f6" font-weight="700">z</tspan><tspan> = μ + </tspan><tspan fill="#f9e2af" font-weight="700">σ</tspan><tspan> · </tspan><tspan fill="#7ddba0" font-weight="700">ε</tspan>
  </text>
  <text x="470" y="60" text-anchor="middle" fill="#8b8fa3" font-size="12.5" font-style="italic">σ = how wide the Gaussian is.&#160;&#160;&#160;ε = which point inside it we sample this time.</text>

  <!-- ============ left card: sigma ============ -->
  <rect x="20" y="80" width="440" height="380" rx="10" fill="#1a1d27" stroke="#2a2d3a" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" fill="#f9e2af" font-size="16" font-weight="700">σ controls the spread</text>

