  <text x="240" y="382" text-anchor="middle" fill="#e0e0e6" font-size="13">μ</text>

  <text x="358" y="268" fill="#f9e2af" font-size="12.5" font-style="italic">large σ</text>
  <text x="240" y="160" text-anchor="middle" fill="#fab387" font-size="12.5" font-style="italic">small σ</text>

  <text x="240" y="440" text-anchor="middle" fill="#8b8fa3" font-size="12">learned by the encoder — depends on the input image</text>

